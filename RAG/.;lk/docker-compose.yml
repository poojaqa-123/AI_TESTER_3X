services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"  # remove/firewall this in production; only `app` needs to reach it

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./data_sources:/app/data_sources
      - ./uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface  # persist bge-m3/reranker downloads across restarts
    ports:
      - "8060:8060"

volumes:
  qdrant_data:
  hf_cache:
